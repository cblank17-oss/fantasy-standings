name: Update standings

# Standings: once a week after Monday Night Football is final (Tuesday morning ET,
# with a midday retry in case ESPN finalizes late).
# Projections: about every 15 minutes during game windows (Eastern time):
#   Thursday noon – 1 AM   (Thursday night games, plus Thanksgiving afternoon)
#   Sunday 9 AM – 1 AM     (London morning games through Sunday night)
#   Monday 7 PM – 1 AM     (Monday night games)
# GitHub runs scheduled jobs late or not at all when it's busy, so the windows are
# polled every 5 minutes and build.py skips a run if projections were refreshed
# less than 12 minutes ago. Cron is UTC, so the polling hours are wide enough to
# cover both EDT and EST, and each run checks the real Eastern time first.
on:
  schedule:
    - cron: "17 10 * * 2"            # Tue ~6 AM ET: full standings rebuild
    - cron: "17 16 * * 2"            # Tue ~noon ET: retry
    - cron: "*/5 16-23 * * 4"        # Thursday ET
    - cron: "*/5 0-5 * * 5"          # Thursday night ET (Fri UTC)
    - cron: "*/5 13-23 * * 0"        # Sunday ET
    - cron: "*/5 0-5 * * 1"          # Sunday night ET (Mon UTC)
    - cron: "*/5 23 * * 1"           # Monday evening ET
    - cron: "*/5 0-5 * * 2"          # Monday night ET (Tue UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.result.outputs.deploy }}
    steps:
      - id: mode
        run: |
          sched="${{ github.event.schedule }}"
          if [ -z "$sched" ] || [ "$sched" = "17 10 * * 2" ] || [ "$sched" = "17 16 * * 2" ]; then
            mode=full
          else
            # Day (1=Mon … 7=Sun) and hour in Eastern time.
            case "$(TZ=America/New_York date +%u:%-H)" in
              4:1[2-9]|4:2[0-3]|5:0)           mode=projections ;;  # Thursday noon – 1 AM
              7:9|7:1[0-9]|7:2[0-3]|1:0)       mode=projections ;;  # Sunday 9 AM – 1 AM
              1:19|1:2[0-3]|2:0)               mode=projections ;;  # Monday 7 PM – 1 AM
              *)                               mode=skip ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"
      - if: steps.mode.outputs.mode != 'skip'
        uses: actions/checkout@v4
      - if: steps.mode.outputs.mode != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.mode.outputs.mode == 'full'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.mode.outputs.mode == 'full'
        run: |
          node --test tests/scoring.test.js tests/history.test.js
          python -m unittest discover -s tests -t .
      - if: steps.mode.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = projections ]; then
            python build.py --min-minutes 12 --projections-only "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            python build.py
          fi
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - id: result
        run: |
          if [ -d site ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.result.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
